<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TIDHAR — sources</title><style>
:root{color-scheme:dark;--bg:#0B0E13;--card:#151A22;--line:rgba(255,255,255,.08);--txt:#EDF1F6;--mute:#9AA6B5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:1060px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:28px;font-weight:600;margin:0 0 6px}
h2{font-size:21px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 12px}
p{margin:0;color:var(--mute)}
.intro{max-width:720px;margin-bottom:34px}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:22px}
.tete{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:99px;flex:none}
.badge{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
a.btn{display:inline-flex;flex-direction:column;padding:12px 16px;border-radius:14px;text-decoration:none;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);min-width:200px}
a.btn:hover{background:rgba(255,255,255,.11)}
a.btn b{font-weight:600;font-size:15px}
a.btn span{font-size:12.5px;color:var(--mute)}
a.btn.main{border-color:var(--acc)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
figure{margin:0}
figure a{display:block;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
figure img{display:block;width:100%;height:190px;object-fit:contain}
figcaption{font-size:12.5px;color:var(--mute);margin-top:6px}
footer{margin-top:36px;font-size:13px;color:var(--mute)}
footer a{color:var(--txt)}
@media (max-width:600px){a.btn{min-width:0;flex:1 1 100%}}
</style></head>
