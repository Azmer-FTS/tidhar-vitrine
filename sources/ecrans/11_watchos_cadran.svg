<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" font-family="Helvetica, Arial, sans-serif">
<defs>
<radialGradient id="wday" cx="50%" cy="46%" r="60%"><stop offset="0" stop-color="#FFF5DC"/><stop offset="1" stop-color="#B6D2EA"/></radialGradient>
</defs>
<!-- Apple Watch body -->
<rect x="34" y="14" width="172" height="272" rx="46" fill="#0b0b0d" stroke="#2a2a2e" stroke-width="2"/>
<!-- crown -->
<rect x="206" y="120" width="7" height="34" rx="3" fill="#3a3a3e"/>
<!-- screen -->
<rect x="48" y="28" width="144" height="244" rx="36" fill="#EAF1F8"/>
<!-- status time -->
<text x="120" y="50" font-size="13" fill="#1B3A5C" text-anchor="middle" font-weight="600">12:10</text>
<!-- dial: full zmanim crown + sky face + jewish gold hands -->
<g transform="translate(120,150)">
<circle r="66" fill="none" stroke="#B5C2D5" stroke-width="1"/>
<!-- zmanim arcs (couronne = Tout) -->
<path d="M 0 -66 A 66 66 0 0 1 33 -57" fill="none" stroke="#E08A3C" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 40 -52 A 66 66 0 0 1 57 -33" fill="none" stroke="#4F9BD9" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 60 -27 A 66 66 0 0 1 66 0" fill="none" stroke="#E5B23A" stroke-width="3.5" stroke-linecap="round"/>
<path d="M 64 22 A 66 66 0 0 1 47 47" fill="none" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
<path d="M 33 57 A 66 66 0 0 1 0 66" fill="none" stroke="#3D5A80" stroke-width="3.5" stroke-linecap="round"/>
<path d="M -57 33 A 66 66 0 0 1 -66 0" fill="none" stroke="#1B3A5C" stroke-width="3.5" stroke-linecap="round"/>
<!-- face -->
<circle r="54" fill="url(#wday)" stroke="#111" stroke-width="3"/>
<!-- ticks -->
<g stroke="#1B3A5C" stroke-width="1.6">
<line x1="0" y1="-50" x2="0" y2="-43"/><line x1="50" y1="0" x2="43" y2="0"/><line x1="0" y1="50" x2="0" y2="43"/><line x1="-50" y1="0" x2="-43" y2="0"/>
</g>
<g stroke="#1B3A5C" stroke-width="1" opacity="0.5"><line x1="25" y1="-43" x2="22" y2="-38"/><line x1="43" y1="-25" x2="38" y2="-22"/><line x1="43" y1="25" x2="38" y2="22"/><line x1="25" y1="43" x2="22" y2="38"/><line x1="-25" y1="43" x2="-22" y2="38"/><line x1="-43" y1="25" x2="-38" y2="22"/><line x1="-43" y1="-25" x2="-38" y2="-22"/><line x1="-25" y1="-43" x2="-22" y2="-38"/></g>
<!-- center jewish time + next zman -->
<text x="0" y="-2" font-size="20" fill="#1B3A5C" text-anchor="middle" font-weight="700">11:59</text>
<text x="0" y="14" font-size="9" fill="#4F9BD9" text-anchor="middle" font-weight="500">16:47  Min'ha K.</text>
<!-- jewish gold hour + civil hands ~ -->
<line x1="0" y1="0" x2="22" y2="-19" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<line x1="0" y1="0" x2="0" y2="-40" stroke="#111" stroke-width="2" stroke-linecap="round"/>
<line x1="0" y1="0" x2="-16" y2="-13" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
<line x1="0" y1="0" x2="-30" y2="10" stroke="#C0392B" stroke-width="1.2" stroke-linecap="round"/>
<circle r="3" fill="#C0392B"/>
</g>
<text x="120" y="290" font-size="8" fill="#7A8CA3" text-anchor="middle">watchOS · cadran complet (couronne Tout · aiguilles juive+civile)</text>
</svg>
